- id: io-009
  title: "Manguezais SP revela divergências entre monitoramento de campo e satélite"
  level: intelligence
  program: territorio-energia
  domain: "Meio Ambiente / Território"
  question: "O monitoramento de manguezais por satélite é consistente com dados de campo?"
  finding: "O case Manguezais SP (4.000 pontos, 7 anos, 364 artigos, 9 territórios) revelou divergências entre monitoramento de campo e dados de satélite que a literatura não explica. O cruzamento de séries temporais de satélite com dados de campo mostrou padrões que nenhuma fonte individual revela."
  implication: "O monitoramento territorial não pode depender de uma única fonte. O cruzamento satélite + campo + literatura é necessário para inteligência territorial confiável."
  next_step: "Publicar o case como metodologia de referência para monitoramento costeiro."
