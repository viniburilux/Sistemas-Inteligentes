  question: "É possível classificar espectros Raman automaticamente com alta precisão?"
  finding: "3.510 espectros Raman validados com Random Forest atingiram 99,43% de acurácia (702 amostras de teste, apenas 4 erros). Pré-processamento ALS+SNV. Paper em revisão na Frontiers in Nanotechnology. Buscando piloto industrial de 4-8 semanas."
