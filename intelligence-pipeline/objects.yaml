- id: io-007
  title: "Experimento prova que infraestrutura Lux é objetivamente melhor que LLM puro"
  level: intelligence
  program: ciencia-tecnologia
  domain: "Ciência / P&D"
  question: "A infraestrutura Lux produz respostas melhores que um LLM puro?"
  finding: "Experimento controlado: mesma pergunta (nematoides em soja), mesmas 5 fontes web_search. Resposta Lux: 8 EvidenceReferences com DOI, 5 Claims, 3 gaps declarados, separação observado/inferido. Resposta LLM pura: sem proveniência, sem gaps, sem fontes linkadas."
  implication: "A diferença não é conteúdo — é rastreabilidade. Um profissional pode verificar cada afirmação. O LLM puro exige confiança cega. O ganho da infraestrutura Lux é 'saber como se sabe' e 'saber o que não se sabe'."
  next_step: "Publicar o experimento como demonstração interativa — permitir que qualquer visitante veja a diferença ao vivo."
  status: observed
  date: "2026-09-12"
  sources:
    - "Experimento Sistemas-Inteligentes (commit dc72e8a)"
  projects: ["tracefoundry", "Sistemas-Inteligentes"]
  entities: ["EvidenceReference", "Claim", "web_search", "proveniência"]
  publish_level: public

- id: io-008
