  finding: "O Representation Lab provou que R4 (temporal), R5 (atores) e R6 (citações) são 100% reutilizáveis sem adaptação. Foram aplicadas a metalurgia com 2.187 entidades e 18.445 relações usando os mesmos schemas — e funcionariam para qualquer outro domínio."
  implication: "Representações reutilizáveis significam que um agente pode pular de patentes minerais para biotecnologia sem trocar de ferramenta de representação."
