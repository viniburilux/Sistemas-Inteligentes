- id: io-001
  title: "Bacillus halotolerans Ba2-6 reduz 93,85% dos juvenis de nematoides"
  level: intelligence
  program: biotecnologia-agro
  domain: "Biotecnologia / Agro"
  question: "Quais cepas de Bacillus apresentam eficácia comprovada contra nematoides em soja?"
  finding: "A cepa Ba2-6 de Bacillus halotolerans demonstrou 93,85% de mortalidade de juvenis J2 de Heterodera glycines, com ativação de resistência sistêmica via ácido salicílico (PR1, PR5, NPR1-2) e jasmonato (PR3a). Estudos de campo mostraram redução de 74,29% na penetração total de nematoides."
  implication: "As cepas brasileiras de Bacillus podem ser tão ou mais eficazes que as estrangeiras, mas faltam estudos comparativos em condições tropicais. A combinação Bacillus + Trichoderma mostra sinergia promissora."
  next_step: "Mapear cepas nativas de Bacillus registradas no MAPA/AGROFIT e cruzar com literatura para identificar candidatos a testes comparativos."
  status: observed
  date: "2026-09-12"
  sources:
    - "DOI:10.1186/s12866-024-03514-y"
    - "DOI:10.16768/j.issn.1004-874x.2025.07.005"
  projects: ["inteligencia-biotecnologica"]
  entities: ["Bacillus halotolerans", "Heterodera glycines", "Bacillus subtilis", "soja"]
  publish_level: public

- id: io-002
  title: "Nordeste lidera transformação territorial no Brasil (2017-2024)"
  level: intelligence
  program: territorio-energia
  domain: "Território / Sensoriamento Remoto"
  question: "Onde o território brasileiro está mudando mais rapidamente?"
  finding: "O TTI (Índice de Transformação Territorial) revelou que o Nordeste lidera a transformação territorial média — não a Amazônia. O caso Remanso/BA foi detectado por satélite antes de aparecer em qualquer literatura. Distribuição heavy-tailed: 10% das regiões concentram 70% da mudança."
  implication: "Monitoramento por embeddings de satélite detecta transformação precoce onde NDVI e métodos convencionais falham. Aplicável a mineração, energia, meio ambiente e planejamento territorial."
  next_step: "Integrar TTI com dados de contratação pública (PNCP) para detectar correlações entre transformação territorial e gasto público."
  status: observed
  date: "2026-09-12"
  sources:
    - "TTI Brasil 2017-2024 (CC-BY 4.0)"
    - "IJCAI-ECAI 2026 / GlobalSouthAI"
  projects: ["ghostworks", "TTI_Brazil_2017_2024"]
  entities: ["TTI", "AlphaEarth", "Nordeste", "Remanso/BA"]
  publish_level: public

- id: io-003
  title: "GhostWorks revela 6 regimes distintos de transformação territorial"
  level: intelligence
  program: territorio-energia
  domain: "Território / Mineração / Energia"
  question: "Quais fenômenos geram assinaturas territoriais distintas?"
  finding: "O GhostWorks Atlas (887 trajetórias, 2018-2024) identificou 6 regimes: Carajás (mineração — contínuo e previsível), Yanomami (garimpo — irregular e sazonal), MATOPIBA (agro — expansão acelerada pós-2020), Permian Flaring (petróleo — mais distinto dinamicamente), Camaçari (indústria — estável, baixa variação) e Mar Aral (colapso e estabilização)."
  implication: "Cada fenômeno tem uma 'assinatura temporal' identificável. Isso permite classificar automaticamente o tipo de transformação em novas regiões."
  next_step: "Treinar classificador de regime territorial a partir das 887 trajetórias para detectar automaticamente o tipo de fenômeno em novas áreas."
  status: observed
  date: "2026-09-12"
  sources:
    - "GhostWorks Atlas (github.com/viniburilux/ghostworks-atlas)"
    - "TTI Brasil 2017-2024"
  projects: ["ghostworks", "ghostworks-atlas", "TTI_Brazil_2017_2024"]
  entities: ["Carajás", "Yanomami", "MATOPIBA", "Permian Flaring", "Camaçari"]
  publish_level: public

